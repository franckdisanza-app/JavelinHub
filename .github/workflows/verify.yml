# =============================================================================
# The suites, run by something other than a person remembering.
# =============================================================================
#
# `README.md` says of the authorization suite: "verify:authz is the executable
# half of the security model … Run it after any change to src/lib/data/**."
# Until this file existed, nothing enforced that sentence. A control that
# depends on somebody typing a command is not a control, and the two mock
# suites are between them 1,535 assertions about who may do what.
#
# WHAT IS DELIBERATELY NOT HERE: `npm run verify:supabase`. It runs against
# whatever `NEXT_PUBLIC_SUPABASE_URL` names, which for this project is the LIVE
# database — its own header says so, and says it is read-only by default for
# exactly that reason. Pointing CI at production would be wrong even for reads:
# it would put the project's credentials in a place every fork's pull request
# can reach. It stays a manual, operator-run check until there is a second,
# test-only project to aim it at.
#
# NO SECRETS ARE NEEDED, and that is a property worth preserving. The suites
# hard-set `DATA_BACKEND=mock` and provision their own throwaway store; the
# build below is given the same mock values explicitly rather than inheriting
# a `.env.local` that does not exist in CI. The unit tests need no environment
# at all — they import pure functions and call them.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-run after an infrastructure blip without an
  # empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # `verify:pages` boots a dev server and waits up to 180s for it; the whole
    # job is well inside this, and the cap is here so a hung server fails
    # rather than burning an hour.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18 is a hard floor, not a preference: `register-ts.mjs` refuses
          # to start below it, because native TypeScript type stripping is what
          # lets the suites import `src/**` directly. Pinned to the 22 line so a
          # new major cannot change the answer without somebody choosing it.
          node-version: "22.x"
          cache: npm

      - name: Install
        run: npm ci

      # `npm run typecheck` is `next typegen && tsc --noEmit`, and the first
      # half is not decoration. Next 16 GENERATES `PageProps`, `LayoutProps`
      # and `RouteContext` into `.next/types/routes.d.ts`, which
      # `tsconfig.json` includes — so on a clean checkout, which is what this
      # runner is, `tsc` alone fails with eight `TS2304: Cannot find name
      # 'PageProps'` errors before it has type-checked a line of the app.
      #
      # THAT IS NOT HYPOTHETICAL: it is why every run of this workflow that
      # has ever existed failed here in about thirty seconds, and therefore
      # why nothing below it has ever gated anything. It passed on a
      # developer's machine for the one reason CI cannot reproduce — a `.next`
      # left behind by the last `next dev`.
      #
      # `typegen` is in the SCRIPT rather than in a step here so that a fresh
      # `git clone && npm ci && npm run typecheck` behaves the same way this
      # runner does. A fix that only exists in the workflow leaves the trap
      # set for the next person to check out the repository.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # Mock values, stated rather than inherited. There is no `.env.local` in
        # CI, so `DATA_BACKEND` would default to `mock` anyway — naming it means
        # a future default change cannot silently point a CI build at a real
        # database. `SESSION_SECRET` is required on both backends since it keys
        # the rate limiter's bucket HMAC; the value here is throwaway and signs
        # nothing that outlives the job.
        #
        # `NEXT_PUBLIC_SITE_URL` IS REQUIRED FOR THE BUILD ITSELF, and its
        # absence here was breaking this step. `next build` sets
        # `NODE_ENV=production`, and it PRERENDERS `/_not-found` — which runs the
        # root layout's `generateMetadata`, which calls `siteUrl()`, which throws
        # in production rather than falling back to localhost. So the build
        # failed with "Missing required environment variable
        # NEXT_PUBLIC_SITE_URL" and took the whole workflow red with it, which
        # meant none of the suites below were gating anything.
        #
        # The value is deliberately NOT the real origin. Nothing in a CI build
        # should know a deployment's address, and `metadataBase` is the only
        # thing that consumes it here — an absolute URL in markup nobody serves.
        env:
          DATA_BACKEND: mock
          SESSION_SECRET: ci-throwaway-session-secret
          SEED_ADMIN_PASSWORD: ci-throwaway-admin-password
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
        run: npm run build

      # The fastest of the four and therefore the first: pure functions, no
      # server, no store, no browser. It covers the three boundaries the other
      # suites are structurally unable to reach — `safeNextPath`, which decides
      # where a login may redirect to; the price parser, whose own comment
      # records a hundredfold overcharge; and the upload checks, which need a
      # `File` and a storage backend the mock does not have.
      - name: Unit tests
        run: npm run test:unit

      - name: Authorization suite
        # The RLS twin: every rule the policy set encodes, asserted against the
        # mock implementation of it. Sets its own environment.
        run: npm run verify:authz

      - name: Rendered-page suite
        # Starts its own dev server on a free port against a throwaway store,
        # and clears Next's data cache at both ends so a previous run cannot
        # answer for this one.
        run: npm run verify:pages

      # The third suite, and the only one that needs a browser. It asserts the
      # things the two above are structurally incapable of seeing — 375px
      # overflow, computed border-radius and box-shadow, rendered target size —
      # which `PROGRESS.md` spent a whole section warning were unobserved.
      #
      # CHROMIUM ONLY, and `--only-shell`: the suite measures layout, not
      # cross-engine rendering, and the headless shell is a fraction of the
      # download. `playwright.config.ts` says why the mobile project is a
      # viewport rather than `devices['iPhone SE']` — that preset would pull in
      # WebKit for assertions that are not engine-specific.
      - name: Install Chromium for the visual suite
        run: npx playwright install chromium --only-shell --with-deps

      - name: Visual and layout suite
        # Boots its own `next dev` against a throwaway mock store on port 3100.
        # Needs no secrets, like everything else in this workflow.
        run: npm run verify:visual

      # Only on a failure, and only the traces — a green run of a layout suite
      # should not fill the artifact store with identical screenshots.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
